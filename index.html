<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <!--
      The privacy boundary, enforced by the browser rather than by good intentions.
      default-src 'none' blocks external fonts, images, frames and any origin we did not
      serve ourselves. connect-src must include 'self' because the browser fetches the
      wasm module over the same directive — there is no other endpoint on this origin, and
      the app never issues a request of its own. script-src needs 'unsafe-inline' for the
      loader Trunk emits, and 'wasm-unsafe-eval' to instantiate the module.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self' blob:; base-uri 'none'; form-action 'none'"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230f4c81'/%3E%3C/svg%3E"
    />
    <title>Consent form builder</title>
    <link data-trunk rel="rust" data-wasm-opt="0" />
    <link data-trunk rel="copy-dir" href="fonts" />
    <link data-trunk rel="css" href="styles.css" />
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
