[package]
name = "consent-form"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
description = "Client-side consent form builder for SACT and radiotherapy. Nothing leaves the browser."
publish = false

[dependencies]
yew = { version = "0.23", features = ["csr"] }
lopdf = "0.46"
gloo-net = { version = "0.7", features = ["http"] }
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3.106"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zeroize = { version = "1.9.1", features = ["derive"] }

[dependencies.web-sys]
version = "0.3.106"
features = [
    "Blob",
    "BlobPropertyBag",
    "CanvasRenderingContext2d",
    "DomRect",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlAnchorElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "Location",
    "MouseEvent",
    "Node",
    "PointerEvent",
    "Window",
    "console",
]

# lopdf pulls getrandom, which refuses to build for wasm32-unknown-unknown unless the
# browser RNG backend is switched on explicitly.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

# Smallest practical binary: wasm-opt runs after this, and every kilobyte is a
# download on a clinic machine.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
